# =============================================================================
#  MILO Recovery Kit — deployment settings
#
#  THIS IS THE ONLY FILE YOU NEED TO EDIT to point the kit at your own GitHub
#  repository and website. Everything else (installer, updater, repair UI,
#  the download card in the web app) reads its defaults from here.
#
#  After editing:  cd frontend && npm run build     ← republishes the kit
# =============================================================================

# Your GitHub repository, in owner/repo form.
# Over-the-air updates pull from here.
#
# NOTE: this repository is PRIVATE, so every machine needs a read-only GitHub
# token. Pass it once at install time:
#     sudo bash install.sh --github-token github_pat_xxx
# It is saved to /opt/milo/data/config.env (chmod 640) and reused for updates.
# The token is never sent to browsers and never leaves the machine.
MILO_REPO="EKOKIBO/MILO-Backend"

# Branch used by the 'beta' channel, and by the installer.
# You have no GitHub releases yet, so the 'stable' channel automatically falls
# back to the newest commit on this branch. Publish a release tag later to get
# true stable/beta separation.
MILO_BRANCH="main"

# Where the web app is published (no trailing slash), e.g.
# "https://milo-robotics.org" or your Cloudflare/Vercel domain.
#
# Leave EMPTY and the app works it out from whatever address the browser is
# using, so the download card and the copy-paste command are always correct.
# Only set it if you want the on-device repair UI to print an absolute URL.
MILO_SITE=""

# Where .hef AI models are hosted. The installer appends the accelerator type:
#     ${MILO_MODEL_BASE}/milo-hailo8.hef   (or -hailo8l)
#
# Leave EMPTY if you do not host models. The installer then, in order:
#   1. uses a .hef bundled in the repo,
#   2. adopts the .hef already present on the machine  ← your case today,
#   3. tells the technician to copy one in manually.
MILO_MODEL_BASE=""

# Contact address embedded in web-push notifications (required by the spec).
MILO_VAPID_SUBJECT="mailto:emikalchev@gmail.com"
